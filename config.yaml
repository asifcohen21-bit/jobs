limits:
  max_messages_per_run: 25      # normal cap of Telegram alerts per run
  seed_max_messages: 10         # cap on the very first run (empty database)
  drushim_pages_per_query: 2    # JSON API pages fetched per query
  linkedin_queries_per_run: 10  # rotated between runs so all queries cycle
  alljobs_queries_per_run: 5
  besteffort_queries_per_run: 4 # Indeed/Glassdoor direct attempts
  jsearch_monthly_budget: 180   # free tier = ~200 req/month, keep headroom
  jsearch_queries_per_slot: 2   # requests per active slot
  jsearch_slot_hours_utc: [5, 10, 15]  # 3 slots/day -> ~6 requests/day
  request_delay_seconds: 1.0    # politeness delay between HTTP requests
  seen_retention_days: 60       # prune dedup entries older than this
