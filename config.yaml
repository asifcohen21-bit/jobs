# In "student" mode a job passes if a student word appears in title/description
# OR a part-time word appears in title/description/scope
student_words:
  - סטודנט
  - סטודנטית
  - סטודנטים
  - סטודנטיות
  - student
  - students
parttime_words:
  - משרה חלקית
  - חלקית
  - חצי משרה
  - היקף חלקי
  - part time
  - part-time
  - parttime

# Jobs whose TITLE contains any of these are rejected
exclude_words:
  - מכירות
  - טלמרקטינג
  - טלמיטינג
  - נהג
  - מלצר
  - מלצרות
  - אבטחה
  - מאבטח
  - קופה
  - קופאי
  - שליח
  - שליחויות
  - sales representative
  - driver
  - waiter
  - cashier

# Jobs from these companies are always skipped (exact-word match on the
# company name). Useful against advertisers that flood the boards.
# Example: uncomment the next line to silence Experis Academy course ads.
exclude_companies: []
#  - Experis Academy

